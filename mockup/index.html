<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocApp Go Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: atril de presentación — índice de pantallas a la izquierda, el teléfono en el centro, la ficha técnica a la derecha. Todo en una sola pantalla. */
:root {
  --bg: #EEF3F7;
  --surface: #FFFFFF;
  --ink: #0F172A;
  --muted: #56667A;
  --line: #D8E1EA;
  --accent: #0284C7;
  --accent-soft: #E0F2FE;
  --native: #7C3AED;
  --native-soft: #F1EAFE;
  --plan: #B45309;
  --plan-soft: #FEF3C7;
  --device: #0B1220;
  --f-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
/* La página de presentación queda siempre en modo claro; solo el teléfono cambia de tema. */

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell {
  height: 100%; display: grid; grid-template-rows: auto 1fr;
  padding-inline: 16px; padding-block: 0 14px; gap: 12px;
}

/* ---------- Barra superior ---------- */
.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 12px; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--accent);
  display: grid; place-items: center; color: #fff; flex: none;
}
.brand-name { font-family: var(--f-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.brand-sub { font-size: 12px; color: var(--muted); }
.roles { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
.roles button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer;
  font-size: 13px; font-weight: 600; color: var(--muted);
}
.roles button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.apptheme { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.switch { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.switch button {
  border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; cursor: pointer;
  display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted);
}
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ---------- Cuerpo en tres columnas ---------- */
.main { display: grid; grid-template-columns: 210px minmax(0, 1fr) 400px; gap: 20px; min-height: 0; }

.index { display: flex; flex-direction: column; min-height: 0; }
.index h2, .spec h2 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 8px; font-weight: 700; }
.screens { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.screens button {
  width: 100%; display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 6px;
  text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 8px; cursor: pointer;
}
.screens button:hover { background: var(--surface); }
.screens button[aria-current="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.screens .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.screens .t { font-weight: 600; font-size: 13px; }
.screens button[aria-current="true"] .t { color: var(--accent); }
.screens .tags { grid-column: 2; display: flex; gap: 4px; flex-wrap: wrap; }
.legend { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 8px; }

.tag { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; }
.tag.native { background: var(--native-soft); color: var(--native); }
.tag.plan { background: var(--plan-soft); color: var(--plan); }

/* ---------- Escenario con el teléfono ---------- */
.stage { display: flex; flex-direction: column; align-items: center; min-height: 0; min-width: 0; gap: 10px; }
.stage-inner { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
.device {
  background: var(--device); border-radius: 46px; padding: 10px; position: relative;
  box-shadow: 0 30px 60px -20px rgba(2, 8, 23, 0.45), 0 0 0 1px rgba(148, 163, 184, 0.25);
}
.viewport { overflow: hidden; border-radius: 37px; position: relative; }
.app {
  width: 375px; height: 812px; transform-origin: top left; position: absolute; top: 0; left: 0;
}
.controls { display: flex; align-items: center; gap: 12px; }
.controls button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 38px; height: 38px;
  display: grid; place-items: center; cursor: pointer;
}
.controls button:disabled { opacity: 0.4; cursor: default; }
.counter { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 60px; text-align: center; }

/* ---------- Ficha de la pantalla ---------- */
.spec { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; padding-right: 2px; }
.card-s { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 18px; }
.spec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.spec-role { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.spec-title { font-family: var(--f-display); font-size: 32px; line-height: 1.1; margin: -8px 0 0; text-wrap: balance; }
.spec-sum { margin: -4px 0 0; font-size: 16px; line-height: 1.5; text-wrap: pretty; }
.lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.keys { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.keys li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 500; line-height: 1.4; }
.keys li svg { color: var(--accent); margin-top: 2px; flex: none; }
.goto { display: flex; flex-wrap: wrap; gap: 8px; }
.goto button {
  border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 12px; min-height: 40px;
  font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
}
.goto button:hover { border-color: var(--accent); color: var(--accent); }
details.more { border-top: 1px solid var(--line); padding-top: 10px; }
details.more summary, .nat summary {
  cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px;
  font-size: 13.5px; font-weight: 600; color: var(--accent);
}
details.more summary::-webkit-details-marker, .nat summary::-webkit-details-marker { display: none; }
details summary svg { transition: transform 0.15s ease; }
details[open] > summary svg { transform: rotate(90deg); }
.more-body { display: grid; gap: 12px; margin-top: 8px; font-size: 13.5px; line-height: 1.5; }
.more-body .lbl { margin-bottom: 2px; }
.more-body code { font-family: var(--f-mono); font-size: 12px; background: var(--bg); border-radius: 6px; padding: 3px 7px; overflow-wrap: anywhere; display: inline-block; }
.planbox { background: var(--plan-soft); border-radius: 10px; padding: 10px 12px; }
.planbox .lbl { color: var(--plan); }
.pill { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.pill.plan { background: var(--plan-soft); color: var(--plan); }
.pill.native { background: var(--surface); color: var(--native); }
.card-s.native { background: var(--native-soft); border-color: transparent; gap: 16px; }
.card-s.native .spec-role { color: var(--native); }
.nat { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; }
.nat-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--surface); color: var(--native); display: grid; place-items: center; }
.nat-name { font-weight: 700; font-size: 16px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.nat-lib { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; color: var(--native); }
.nat p { margin: 2px 0 0; font-size: 14px; line-height: 1.45; }
.nat summary { color: var(--native); font-size: 13px; }
.nat .why { margin-top: 4px; font-size: 13.5px; line-height: 1.5; }
.soon { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.flowbar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; max-width: 720px; }
.flowbar .flow-lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 4px; }
.flowbar button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted);
}
.flowbar button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.flowbar .arrow { color: var(--muted); font-size: 11px; }

@media (max-width: 1180px) {
  .main { grid-template-columns: 190px minmax(0, 1fr) 340px; gap: 14px; }
  .spec-title { font-size: 28px; }
}
@media (max-width: 960px) {
  html, body { height: auto; }
  .shell { height: auto; }
  .main { grid-template-columns: 1fr; }
  .index { order: 2; }
  .screens { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .screens button { width: auto; white-space: nowrap; }
  .screens .tags { display: none; }
  .legend { display: none; }
  .stage { order: 1; }
  .stage-inner { height: 70vh; min-height: 520px; }
  .spec { order: 3; overflow: visible; }
}

/* =================================================================
   APP — réplica de los temas de src/theme/tokens.ts
   Tema A (claro, Minimalista clínico) y Tema C (oscuro, Moderno premium)
   ================================================================= */
.app[data-mode="light"] {
  --a-bg: #FFFFFF; --a-fg: #0F172A; --a-card: #FFFFFF; --a-pri: #0284C7; --a-prifg: #FFFFFF;
  --a-mut: #F1F5F9; --a-mutfg: #64748B; --a-bd: #E2E8F0; --a-acc: #E0F2FE; --a-accfg: #0284C7;
  --a-ok: #22C55E; --a-okbg: #DCFCE7; --a-okfg: #15803D; --a-warnbg: #FEF3C7; --a-warnfg: #B45309;
  --a-danger: #EF4444; --a-r1: 2px; --a-r2: 4px; --a-r3: 8px;
  --a-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
  --a-head: "Inter", system-ui, sans-serif; --a-body: "Inter", system-ui, sans-serif;
  --a-map: #EAF0F4; --a-road: #FFFFFF; --a-park: #D7EBD9; --a-water: #CFE3F2;
}
.app[data-mode="dark"] {
  --a-bg: #020617; --a-fg: #F8FAFC; --a-card: #0F172A; --a-pri: #10B981; --a-prifg: #020617;
  --a-mut: #1E293B; --a-mutfg: #94A3B8; --a-bd: #334155; --a-acc: #10B981; --a-accfg: #020617;
  --a-ok: #10B981; --a-okbg: #064E3B; --a-okfg: #6EE7B7; --a-warnbg: #451A03; --a-warnfg: #FCD34D;
  --a-danger: #F87171; --a-r1: 8px; --a-r2: 12px; --a-r3: 16px;
  --a-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
  --a-head: "Playfair Display", Georgia, serif; --a-body: "Plus Jakarta Sans", system-ui, sans-serif;
  --a-map: #0B1324; --a-road: #1B2740; --a-park: #0F2A22; --a-water: #0C2238;
}
.app { background: var(--a-bg); color: var(--a-fg); font-family: var(--a-body); font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
.app * { box-sizing: border-box; }
.app button { cursor: pointer; font-family: inherit; }
.statusbar { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 28px 0 32px; font-size: 14px; font-weight: 600; position: relative; z-index: 5; }
.statusbar .notch { position: absolute; left: 50%; top: 10px; width: 110px; height: 30px; margin-left: -55px; background: #000; border-radius: 20px; }
.statusbar .sb-icons { display: flex; gap: 5px; align-items: center; }
.content { flex: 1; overflow-y: auto; padding: 8px 20px 24px; scrollbar-width: none; position: relative; }
.content::-webkit-scrollbar { display: none; }
.content.flush { padding: 0; }
.homebar { height: 22px; flex: none; display: grid; place-items: center; }
.homebar i { width: 130px; height: 5px; border-radius: 3px; background: var(--a-fg); opacity: 0.85; display: block; }
.tabbar { flex: none; display: flex; border-top: 1px solid var(--a-bd); background: var(--a-card); padding-top: 6px; }
.tabbar button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--a-mutfg); font-size: 10.5px; font-weight: 500; min-height: 48px; }
.tabbar button.on { color: var(--a-pri); font-weight: 600; }

.h1 { font-family: var(--a-head); font-size: 24px; font-weight: 700; margin: 6px 0 16px; letter-spacing: -0.01em; }
.h2 { font-family: var(--a-head); font-size: 17px; font-weight: 700; margin: 0; }
.sect { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 10px; }
.sect .h2 { font-size: 16px; }
.link { color: var(--a-pri); font-weight: 600; font-size: 13px; background: none; border: 0; padding: 0; }
.mut { color: var(--a-mutfg); }
.small { font-size: 12px; }
.card { background: var(--a-card); border: 1px solid var(--a-bd); border-radius: var(--a-r3); box-shadow: var(--a-shadow); padding: 14px; }
button.card { width: 100%; text-align: left; color: inherit; display: block; }
.stack { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; }
.row > .grow { flex: 1; min-width: 0; }
.av { width: 46px; height: 46px; border-radius: 50%; background: var(--a-acc); color: var(--a-accfg); display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
.av.lg { width: 84px; height: 84px; font-size: 26px; }
.name { font-weight: 600; font-size: 15px; }
.meta { display: flex; align-items: center; gap: 6px; color: var(--a-mutfg); font-size: 12.5px; }
.btn { border: 0; border-radius: var(--a-r2); background: var(--a-pri); color: var(--a-prifg); font-weight: 600; font-size: 14px; min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
.btn.ghost { background: var(--a-mut); color: var(--a-fg); }
.btn.outline { background: transparent; color: var(--a-pri); box-shadow: inset 0 0 0 1px var(--a-bd); }
.btn.danger { background: transparent; color: var(--a-danger); box-shadow: inset 0 0 0 1px var(--a-bd); }
.btnrow { display: flex; gap: 8px; }
.badge { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.badge.ok { background: var(--a-okbg); color: var(--a-okfg); }
.badge.warn { background: var(--a-warnbg); color: var(--a-warnfg); }
.badge.info { background: var(--a-acc); color: var(--a-accfg); }
.badge.mute { background: var(--a-mut); color: var(--a-mutfg); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--a-bd); background: var(--a-card); color: var(--a-fg); border-radius: 999px; padding: 0 14px; min-height: 34px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--a-pri); border-color: var(--a-pri); color: var(--a-prifg); }
.field { display: grid; gap: 6px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 600; }
.input { border: 1px solid var(--a-bd); border-radius: var(--a-r2); min-height: 46px; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: var(--a-bg); color: var(--a-fg); font-size: 14px; }
.input.ph { color: var(--a-mutfg); }
.input.area { min-height: 76px; align-items: flex-start; padding-top: 12px; }
.seg { display: flex; background: var(--a-mut); border-radius: var(--a-r3); padding: 4px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--a-mutfg); border-radius: var(--a-r2); min-height: 36px; font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--a-card); color: var(--a-fg); box-shadow: var(--a-shadow); }
.back { display: flex; align-items: center; gap: 8px; margin: 2px 0 14px; }
.back button { border: 0; background: var(--a-mut); color: var(--a-fg); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.back .h2 { font-size: 18px; }
.star { color: #F59E0B; }
.ic { display: block; flex: none; }
.iconbox { width: 40px; height: 40px; border-radius: var(--a-r3); background: var(--a-acc); color: var(--a-accfg); display: grid; place-items: center; flex: none; }
.divider { height: 1px; background: var(--a-bd); margin: 12px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--a-mutfg); }
.kv dd { margin: 0; font-weight: 600; text-align: right; }

.qa { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qa button { border: 0; background: none; color: var(--a-fg); display: grid; justify-items: center; gap: 6px; font-size: 11px; font-weight: 500; }
.qa .circ { width: 56px; height: 56px; border-radius: 50%; background: var(--a-card); border: 1px solid var(--a-bd); box-shadow: var(--a-shadow); color: var(--a-pri); display: grid; place-items: center; }

.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { border: 1px solid var(--a-bd); background: var(--a-card); color: var(--a-fg); border-radius: var(--a-r2); min-height: 44px; font-weight: 600; font-size: 13px; }
.slot.on { background: var(--a-pri); border-color: var(--a-pri); color: var(--a-prifg); }
.slot:disabled { color: var(--a-mutfg); text-decoration: line-through; opacity: 0.6; cursor: default; }
.days { display: flex; gap: 8px; }
.day { flex: 1; border: 1px solid var(--a-bd); background: var(--a-card); color: var(--a-fg); border-radius: var(--a-r3); padding: 8px 0; display: grid; justify-items: center; gap: 2px; font-size: 11px; }
.day b { font-size: 17px; }
.day.on { background: var(--a-pri); border-color: var(--a-pri); color: var(--a-prifg); }

.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { border: 1px solid var(--a-bd); background: var(--a-card); color: var(--a-fg); border-radius: var(--a-r3); box-shadow: var(--a-shadow); padding: 14px 10px; display: grid; justify-items: center; gap: 8px; font-size: 13px; font-weight: 600; text-align: center; position: relative; min-height: 96px; align-content: center; }
.tile .dot { position: absolute; top: 8px; right: 10px; background: var(--a-danger); color: #fff; font-size: 10px; border-radius: 999px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 5px; }
.bell { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--a-bd); background: var(--a-card); color: var(--a-fg); display: grid; place-items: center; }
.bell .dot { position: absolute; top: 4px; right: 4px; background: var(--a-danger); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; min-width: 17px; height: 17px; display: grid; place-items: center; }
.stat { border: 1px solid var(--a-bd); background: var(--a-card); border-radius: var(--a-r3); padding: 12px; display: grid; gap: 2px; }
.stat b { font-family: var(--a-head); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--a-mutfg); }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 92px 1fr 22px; align-items: center; gap: 8px; font-size: 12.5px; }
.bar-track { height: 14px; background: var(--a-mut); border-radius: var(--a-r1); overflow: hidden; }
.bar-fill { height: 100%; background: var(--a-pri); border-radius: var(--a-r1); }
.bar-row b { text-align: right; font-variant-numeric: tabular-nums; }
.check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--a-okfg); }

.steps .line { flex: 1; height: 2px; background: var(--a-bd); }
.radio { display: flex; align-items: center; gap: 12px; padding: 12px 0; border: 0; background: none; color: var(--a-fg); width: 100%; text-align: left; border-bottom: 1px solid var(--a-bd); }
.radio:last-child { border-bottom: 0; }

.map svg.streets { position: absolute; inset: 0; width: 100%; height: 100%; }
.pin { position: absolute; transform: translate(-50%, -100%); border: 0; background: none; padding: 0; display: grid; justify-items: center; }
.pin .head { width: 34px; height: 34px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); display: grid; place-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.25); border: 2px solid #fff; }

.pin.sel .head { width: 42px; height: 42px; }

      clave: ["Mi salud · Favoritos y avisos · Cuenta"],
      ir: [["plan", "Mi plan médico"], ["notificaciones", "Notificaciones"], ["configuracion", "Configuración"], ["login", "Cerrar sesión"]],
      datos: "pacienteService y notificacionService." },
    notificaciones: { rol: "paciente", titulo: "Notificaciones", ruta: "app/(paciente)/cuenta/notificaciones.tsx",
      resumen: "Recordatorios de turnos, resultados y recetas nuevas.",
      clave: ["Los avisos sin leer llevan un punto"],
      ir: [["inicio", "Inicio"]],
      datos: "notificacionService.listNotificaciones().", nativo: ["push"] },
    plan: { rol: "paciente", titulo: "Mi plan médico", ruta: "app/(paciente)/cuenta/plan.tsx",
      resumen: "Tu credencial y lo que cubre tu plan.",
      clave: ["Cuántos centros y profesionales te atienden"],
      ir: [["mapa", "Ver mapa"], ["menu", "Menú"]],
      datos: "planMedicoService e institucionService.", plan: "Fase 3: cada cobertura con su código oficial (OSDE: RNAS 400800)." },
    configuracion: { rol: "paciente", titulo: "Configuración", ruta: "app/(paciente)/cuenta/configuracion.tsx",
      resumen: "Modo claro, oscuro o automático según el teléfono.",
      clave: ["Probalo: el teléfono del emulador cambia de tema"],
      ir: [["menu", "Menú"]],
      datos: "useTheme().setPreferencia()." },
    agenda: { rol: "doctor", titulo: "Agenda", ruta: "app/(doctor)/index.tsx",
      resumen: "El día del profesional: cuántos turnos tiene y quién viene.",
      clave: ["Turnos de hoy y de los próximos 7 días"],
      ir: [["ficha", "Ficha del paciente"], ["pacientes", "Mis pacientes"]],
      datos: "turnoService.listTurnosMedico()." },
    pacientes: { rol: "doctor", titulo: "Mis pacientes", ruta: "app/(doctor)/pacientes.tsx",
      resumen: "Solo los pacientes con un turno próximo con vos.",
      clave: ["Búsqueda por nombre o DNI"],
      ir: [["ficha", "Ficha del paciente"]],
      datos: "pacienteService.listPacientesAsignados()." },
    ficha: { rol: "doctor", titulo: "Ficha del paciente", ruta: "app/(doctor)/paciente/[id].tsx",
      resumen: "Datos del paciente, historial con vos y notas.",
      clave: ["Las notas son privadas: solo las ve quien las escribe"],
      ir: [["pacientes", "Mis pacientes"]],
      datos: "pacienteService, turnoService y notaService." },
    "perfil-doc": { rol: "doctor", titulo: "Perfil profesional", ruta: "app/(doctor)/perfil.tsx",
      resumen: "Cómo te ven los pacientes: matrícula, lugares y horarios.",
      clave: ["Lugares y horarios de atención"],
      ir: [["login", "Cerrar sesión"]],
      datos: "medicoService.getMedico(sesion.medicoId)." },
    panel: { rol: "admin", titulo: "Panel", ruta: "app/(admin)/index.tsx",
      resumen: "Cuántas personas usan la app y con qué obra social.",
      clave: ["Pacientes, profesionales y total", "Gráfico de pacientes por obra social"],
      ir: [["obras", "Obras sociales"], ["instituciones", "Instituciones"]],
      datos: "estadisticaService." },
    obras: { rol: "admin", titulo: "Obras sociales", ruta: "app/(admin)/obras-sociales.tsx",
      resumen: "Alta de obras sociales y sus planes.",
      clave: ["Si la obra social ya existe, el plan se suma a ella"],
      ir: [["instituciones", "Instituciones"]],
      datos: "planMedicoService.crearPlanMedico().", plan: "Fase 3: código oficial RNAS o RNEMP en cada cobertura." },
    instituciones: { rol: "admin", titulo: "Instituciones", ruta: "app/(admin)/instituciones.tsx",
      resumen: "Alta de centros con su ubicación y las coberturas que aceptan.",
      clave: ["Qué centro acepta qué cobertura no existe como dato público: se carga acá"],
      ir: [["panel", "Panel"]],
      datos: "institucionService.crearInstitucion().", plan: "Fase 6: Georef (API del Estado, gratis) completa latitud y longitud a partir de la dirección." }
  };

  var ROLES = [
    ["acceso", "Acceso", ["login", "registro", "registro-paciente", "registro-profesional"]],
    ["paciente", "Paciente", ["inicio", "buscar", "medico", "reservar", "turnos", "calificar", "estudios", "mapa", "menu", "notificaciones", "plan", "configuracion"]],
    ["doctor", "Profesional", ["agenda", "pacientes", "ficha", "perfil-doc"]],
    ["admin", "Administrador", ["panel", "obras", "instituciones"]]
  ];
  var ORDER = [];
  ROLES.forEach(function (r) { ORDER = ORDER.concat(r[2]); });
  var FLUJO = [["login", "Login"], ["inicio", "Inicio"], ["buscar", "Buscar"], ["medico", "Médico"], ["reservar", "Reservar"], ["turnos", "Mis turnos"], ["calificar", "Calificar"]];

  /* ---------------- Render ---------------- */
  var $app = document.getElementById("app");
  var $spec = document.getElementById("spec");
  var $list = document.getElementById("screenList");
  var $roles = document.getElementById("roles");

  function rolDe(id) { return META[id].rol; }

  function renderApp() {
    var mode = ui.pref === "auto" ? ui.mode : ui.pref;
    $app.setAttribute("data-mode", mode);
    var inner = S[ui.screen]();
    var toast = ui.toast ? '<div class="toast" role="status">' + ui.toast + '</div>' : "";
    $app.innerHTML = statusbar() + inner + '<div class="homebar"><i></i></div>' + toast;
  }

  function renderSide() {
    var r = rolDe(ui.screen);
    $roles.innerHTML = ROLES.map(function (x) {
      return '<button type="button" data-rol="' + x[0] + '" aria-pressed="' + (x[0] === r) + '">' + x[1] + '</button>';
    }).join("");
    var grupo = ROLES.filter(function (x) { return x[0] === r; })[0];
    document.getElementById("indexTitle").textContent = "Pantallas · " + grupo[1];
    $list.innerHTML = grupo[2].map(function (id) {
      var m = META[id], idx = ORDER.indexOf(id) + 1;
      var tags = (m.nativo ? '<span class="tag native">Nativo</span>' : "") + (m.plan ? '<span class="tag plan">Plan</span>' : "");
      return '<li><button type="button" data-screen="' + id + '" aria-current="' + (id === ui.screen) + '"><span class="n">' + (idx < 10 ? "0" : "") + idx + '</span><span class="t">' + m.titulo + '</span>' + (tags ? '<span class="tags">' + tags + '</span>' : "") + '</button></li>';
    }).join("");

    var m = META[ui.screen];
    var chev = ic("right", 15, 2.4);
    var html = '<div class="card-s"><div class="spec-head"><span class="spec-role">' + grupo[1] + '</span>' + (m.plan ? '<span class="pill plan">Plan de APIs</span>' : "") + '</div>' +
      '<h1 class="spec-title">' + m.titulo + '</h1><p class="spec-sum">' + m.resumen + '</p>' +
      '<div><div class="lbl">Lo importante</div><ul class="keys">' + m.clave.map(function (x) { return "<li>" + ic("check", 16, 2.6) + "<span>" + x + "</span></li>"; }).join("") + '</ul></div>' +
      '<div><div class="lbl">Desde acá vas a</div><div class="goto">' + m.ir.map(function (x) { return '<button type="button" data-screen="' + x[0] + '">' + x[1] + ic("right", 14, 2.4) + '</button>'; }).join("") + '</div></div>' +
      '<details class="more"><summary>' + chev + 'Ver detalle técnico</summary><div class="more-body">' +
      '<div><div class="lbl">Archivo</div><code>' + m.ruta + '</code></div>' +
      '<div><div class="lbl">De dónde salen los datos</div>' + m.datos + '</div>' +
      (m.plan ? '<div class="planbox"><div class="lbl">Plan de integración de APIs</div>' + m.plan + '</div>' : "") +
      '</div></details></div>';
    if (m.nativo) {
      html += '<div class="card-s native"><div class="spec-head"><span class="spec-role">Componentes nativos</span><span class="pill native">Consigna 1.4</span></div>' +
        m.nativo.map(function (k) {
          var n = NATIVO[k];
          return '<div class="nat"><span class="nat-icon">' + ic(n.icon, 22) + '</span><div><div class="nat-name">' + n.nombre + '<span class="nat-lib">' + n.lib + '</span>' + (n.proximo ? '<span class="soon">Próximo sprint</span>' : "") + '</div><p>' + n.corto + '</p>' +
            '<details><summary>' + chev + 'Justificación técnica</summary><div class="why">' + n.why + '</div></details></div></div>';
        }).join("") + '</div>';
    }
    $spec.innerHTML = html;

    var fi = FLUJO.map(function (f) { return f[0]; }).indexOf(ui.screen);
    document.getElementById("flowbar").innerHTML = '<span class="flow-lbl">Flujo principal</span>' + FLUJO.map(function (f, i) {
      return (i ? '<span class="arrow">→</span>' : "") + '<button type="button" data-screen="' + f[0] + '" aria-current="' + (i === fi) + '">' + f[1] + '</button>';
    }).join("");

    var i = ORDER.indexOf(ui.screen);
    document.getElementById("counter").textContent = (i + 1) + " / " + ORDER.length;
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").disabled = i === ORDER.length - 1;
  }

  var toastTimer = null;
  function showToast(msg) {
    ui.toast = msg; renderApp();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { ui.toast = null; renderApp(); }, 2800);
  }

  function go(id) {
    if (!S[id]) return;
    ui.screen = id; ui.overlay = null; ui.toast = null;
    renderApp(); renderSide();
    var c = $app.querySelector(".content"); if (c) c.scrollTop = 0;
  }

  $app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go],[data-act]");
    if (!el || !$app.contains(el)) return;
    if (el.dataset.med) ui.medico = el.dataset.med;
    if (el.dataset.sel) { ui.mapaSel = el.dataset.sel; ui.mapaFiltro = "todos"; ui.mapaVista = "mapa"; }
    if (el.dataset.filtro) { ui.mapaFiltro = el.dataset.filtro; ui.mapaVista = "mapa"; }
    if (el.dataset.go) { go(el.dataset.go); return; }
    var a = el.dataset.act, v = el.dataset.v;
    if (a === "toast") { showToast(el.dataset.msg); return; }
    if (a === "esp") ui.esp = v;
    else if (a === "day") ui.day = +v;
    else if (a === "slot") ui.slot = v;
    else if (a === "turnosTab") ui.turnosTab = v;
    else if (a === "estudiosTab") ui.estudiosTab = v;
    else if (a === "filtro") { ui.mapaFiltro = v; }
    else if (a === "sel") { ui.mapaSel = v; ui.mapaVista = "mapa"; }
    else if (a === "vista") ui.mapaVista = ui.mapaVista === "mapa" ? "lista" : "mapa";
    else if (a === "rating") ui.rating = +v;
    else if (a.indexOf("crit") === 0) ui.criterios[+a.slice(4)] = +v;
    else if (a === "pref") { ui.pref = v; syncModeSwitch(); }
    else if (a === "overlay") { ui.overlay = v || null; if (el.dataset.msg) { renderApp(); showToast(el.dataset.msg); return; } }
    renderApp();
  });

  document.addEventListener("click", function (e) {
    var s = e.target.closest("[data-screen]");
    if (s) { go(s.dataset.screen); return; }
    var r = e.target.closest("#roles [data-rol]");
    if (r) { var g = ROLES.filter(function (x) { return x[0] === r.dataset.rol; })[0]; go(g[2][0]); }
  });
  document.getElementById("prev").addEventListener("click", function () { var i = ORDER.indexOf(ui.screen); if (i > 0) go(ORDER[i - 1]); });
  document.getElementById("next").addEventListener("click", function () { var i = ORDER.indexOf(ui.screen); if (i < ORDER.length - 1) go(ORDER[i + 1]); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") document.getElementById("next").click();
    if (e.key === "ArrowLeft") document.getElementById("prev").click();
  });

  function syncModeSwitch() {
    var mode = ui.pref === "auto" ? ui.mode : ui.pref;
    Array.prototype.forEach.call(document.querySelectorAll("#modeSwitch button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
    });
  }
  document.getElementById("modeSwitch").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    ui.mode = b.dataset.mode; ui.pref = ui.pref === "auto" ? "auto" : b.dataset.mode;
    syncModeSwitch(); renderApp();
  });

  /* Escala el teléfono para que entre entero en el escenario, sin scroll. */
  var $stage = document.getElementById("stageInner");
  var $device = document.getElementById("device");
  var $viewport = document.getElementById("viewport");
  function fit() {
    var w = $stage.clientWidth, h = $stage.clientHeight;
    var s = Math.min((h - 24) / 832, (w - 8) / 395, 1);
    s = Math.max(s, 0.42);
    $viewport.style.width = (375 * s) + "px";
    $viewport.style.height = (812 * s) + "px";
    $app.style.transform = "scale(" + s + ")";
    $device.style.borderRadius = (46 * s + 4) + "px";
    $viewport.style.borderRadius = (37 * s) + "px";
    $device.style.padding = Math.max(6, 10 * s) + "px";
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe($stage);
  window.addEventListener("resize", fit);

  try {
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ui.mode = "dark";
  } catch (err) { /* sin preferencia: queda claro */ }
  syncModeSwitch();
  renderApp(); renderSide(); fit();
})();
</script>
</body>
</html>
